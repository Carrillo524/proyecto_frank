server:
  port: 8080

spring:
  application:
    name: registros-service

  datasource:
    url: ${DB_URL}
    username: ${US_NAME}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.assistancesystem.registros: INFO